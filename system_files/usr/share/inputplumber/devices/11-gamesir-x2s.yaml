# GameSir X2s Type-C (USB, 3537:0105). Xbox button order (X = BTN_X, Y = BTN_Y)
# on a generic Android HID layout: right stick on Z/RZ, triggers on GAS/BRAKE.
# Home and the record button are swapped from their labels: Home opens Steam's
# Quick Access and the record button (a separate Consumer Control report of Volume
# Down + Power, Android's screenshot shortcut) is the Steam (Guide) button.
version: 1
kind: CompositeDevice
name: GameSir X2s Type-C
matches: []
single_source: false
source_devices:
  - group: gamepad
    evdev:
      name: GAMESIR GameSir-X2s Type-C
      vendor_id: "3537"
      product_id: "0105"
      handler: event*
    capability_map_id: gamesir_x2s_gamepad
  - group: keyboard
    evdev:
      name: GAMESIR GameSir-X2s Type-C Consumer Control
      vendor_id: "3537"
      product_id: "0105"
      handler: event*
    capability_map_id: gamesir_x2s_record
options:
  auto_manage: true
target_devices:
  - xb360
  - keyboard
