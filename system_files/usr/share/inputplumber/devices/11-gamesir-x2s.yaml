# GameSir X2s Type-C (USB, 3537:0105). Xbox button order (X = BTN_X, Y = BTN_Y)
# on a generic Android HID layout: right stick on Z/RZ, triggers on GAS/BRAKE.
# Home and the record button are swapped from their labels: Home opens Steam's
# Quick Access and the record button (a separate Consumer Control report of Volume
# Down + Power, Android's screenshot shortcut) is the Steam button. Both are sent
# by the controller only on release. Steam sees a Steam Deck controller, whose real
# Quick Access button opens at once; an Xbox 360 pad needs Guide, then A 160 ms later.
version: 1
kind: CompositeDevice
name: GameSir X2s Type-C
matches: []
single_source: false
source_devices:
  - group: gamepad
    evdev:
      name: GAMESIR GameSir-X2s Type-C
      vendor_id: "3537"
      product_id: "0105"
      handler: event*
    capability_map_id: gamesir_x2s_gamepad
  - group: keyboard
    evdev:
      name: GAMESIR GameSir-X2s Type-C Consumer Control
      vendor_id: "3537"
      product_id: "0105"
      handler: event*
    capability_map_id: gamesir_x2s_record
  # The phone's motion sensors, for Steam's gyro aiming. houji-gyro creates this
  # device only while gyro aiming is on and this controller is connected.
  - group: imu
    iio:
      name: bmi-houji-imu
options:
  auto_manage: true
  # A USB-PD renegotiation on Houji can reset the whole USB host controller. Keep
  # the virtual controller across that brief disconnect: otherwise Steam replaces
  # its virtual gamepad and a running Proton game does not attach to the new one.
  persist: true
target_devices:
  - deck-uhid
  - keyboard
