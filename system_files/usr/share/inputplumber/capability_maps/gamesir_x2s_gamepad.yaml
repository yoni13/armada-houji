version: 2
kind: CapabilityMap
name: GameSir X2s gamepad
id: gamesir_x2s_gamepad
# Android HID layout: Z/RZ are a centred stick; GAS/BRAKE are triggers.
mapping:
  - name: Right stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_Z
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_RZ
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: RightStick
  - name: Right trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_GAS
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: RightTrigger
  - name: Left trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_BRAKE
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: LeftTrigger
  # Home reports BTN_MODE for about 5 ms, sent when it is released. The Steam Deck
  # target has a real Quick Access button and holds a press shorter than its 8 ms
  # frame over to the next frame, so a direct mapping reaches Steam.
  - name: Home as Quick Access
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess
filtered_events: []
