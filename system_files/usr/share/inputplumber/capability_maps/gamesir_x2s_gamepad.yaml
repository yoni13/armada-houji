version: 2
kind: CapabilityMap
name: GameSir X2s gamepad
id: gamesir_x2s_gamepad
# Android HID layout: Z/RZ are a centred stick; GAS/BRAKE are triggers.
mapping:
  - name: Right stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_Z
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_RZ
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: RightStick
  - name: Right trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_GAS
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: RightTrigger
  - name: Left trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_BRAKE
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: LeftTrigger
  # Home reports BTN_MODE for about 3 ms however long it is held, so it opens Quick
  # Access the way the record button used to: a delayed chord emits Quick Access when
  # Home is released and holds it for 100 ms, long enough for the Xbox 360 target's
  # Guide + A sequence (see gamesir_x2s_record).
  - name: Home as Quick Access
    mapping_type:
      evdev: delayed_chord
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess
  # Only chord mappings record presses, and a delayed chord fires only for recorded
  # ones. The pad has no KEY_F24, so this chord never completes; it tracks Home.
  - name: Track Home presses
    mapping_type:
      evdev: chord
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
      - evdev:
          event_type: KEY
          event_code: KEY_F24
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess
filtered_events: []
