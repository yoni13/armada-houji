version: 2
kind: CapabilityMap
name: GameSir X2s record button
id: gamesir_x2s_record
# The record button reports Volume Down and Power in one HID report and releases
# them about 5 ms later. Both keys are consumed, so the button neither changes the
# volume nor reaches anything as a power key. Volume Up passes through unchanged.
#
# The button is the X2s's Steam button; Home opens Quick Access instead (see
# gamesir_x2s_gamepad). A plain chord sends Guide for as long as the keys are down,
# about 5 ms; the Steam Deck target holds it to its next 8 ms frame. Steam opens
# its menu when the button is released, so holding it longer only delays the menu.
mapping:
  - name: Record as Guide
    mapping_type:
      evdev: chord
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_VOLUMEDOWN
          value_type: button
      - evdev:
          event_type: KEY
          event_code: KEY_POWER
          value_type: button
    target_event:
      gamepad:
        button: Guide
filtered_events: []
