# Experimental Houji profile. Kernel support is maintained under ports/houji.
ARMADA_DEVICE_ID=xiaomi-14
ARMADA_DEVICE_NAME='Xiaomi 14'
ARMADA_SOC_CLASS=SM8650
ARMADA_USB_ROLE_POLICY=typec
ARMADA_PRIMARY_BACKLIGHT=houji-n3
# Native portrait mode.
ARMADA_PANEL_ORIENTATION=normal
# The full-resolution panel exceeds the DPU inline rotation height limit.
ARMADA_GAMESCOPE_USE_ROTATION_SHADER=1
# A 24 px game cursor is about 1.3 mm on this 460 ppi panel. Against 600, the
# 1200 px landscape output gets a 72 px (2 x 36) cursor, about 4 mm.
ARMADA_GAMESCOPE_CURSOR_SCALE_HEIGHT=600
ARMADA_SUSPEND_MODE=s2idle
# The DPU/DSI power-vote fixes allow full display power-down in light sleep.
ARMADA_FAKE_SUSPEND_DISPLAY_MODE=drm
# USB autosuspend remains disabled until its resume path is reliable.
ARMADA_FAKE_SUSPEND_USB_RUNTIME_PM=on
