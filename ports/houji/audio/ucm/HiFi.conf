SectionVerb {
	EnableSequence [
		exec "/usr/bin/python3 /usr/libexec/houji-audio/prepare-protection.py"
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='T Digital PCM Volume' 0"
		cset "name='B Digital PCM Volume' 0"
		cset "name='T PCM Source' None"
		cset "name='B PCM Source' None"
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
	Comment "Internal speakers"
	EnableSequence [
		# Long-sync TDM maps T ASPRX2 to left and B ASPRX2 to right.
		# The protection firmware sums its inputs, so silence input 2.
		cset "name='T DSP RX1 Source' ASPRX2"
		cset "name='T DSP RX2 Source' Zero"
		cset "name='B DSP RX1 Source' ASPRX2"
		cset "name='B DSP RX2 Source' Zero"
		# Conservative fixed amplifier gain; PipeWire handles user volume.
		cset "name='T Analog PCM Volume' 10"
		cset "name='B Analog PCM Volume' 10"
		cset "name='T Digital PCM Volume' 817"
		cset "name='B Digital PCM Volume' 817"
		cset "name='T PCM Source' DSP"
		cset "name='B PCM Source' DSP"
	]
	DisableSequence [
		cset "name='T Digital PCM Volume' 0"
		cset "name='B Digital PCM Volume' 0"
		cset "name='T PCM Source' None"
		cset "name='B PCM Source' None"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackFormat "S32_LE"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackPriority 200
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"
	EnableSequence [
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Volume' 6"
		cset "name='TX0 MODE' ADC_LP"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_DEC0 Volume' 102"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]
	Value {
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CaptureRate 48000
		CapturePriority 200
	}
}
