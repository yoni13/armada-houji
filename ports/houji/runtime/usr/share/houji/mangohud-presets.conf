# Steam performance overlay levels for the Xiaomi 14 (MangoHud 0.8.4).
# These are MangoHud's built-in presets 2-4 without the readings this phone
# cannot provide, which would otherwise show as 0: GPU and CPU power, GPU
# voltage, junction and memory temperatures, memory clock, fan, VRAM (the GPU
# shares system RAM) and RAM temperature. MangoHud does the same for the
# Steam Deck. Set through MANGOHUD_PRESETSFILE in the Steam session.

[preset 2]
horizontal=1
legacy_layout=0
fps=1
table_columns=20
frame_timing=1
frametime=0
cpu_stats=1
gpu_stats=1
ram=1
vram=0
battery=1
hud_no_margin=1
gpu_power=0
cpu_power=0
battery_watt=1
battery_time=1

[preset 3]
cpu_temp=1
gpu_temp=1
ram=1
vram=0
cpu_power=0
gpu_power=0
cpu_mhz=1
gpu_mem_clock=0
gpu_core_clock=1
battery=1
hdr=1
debug=0

[preset 4]
full=1
throttling_status=0
throttling_status_graph=0
io_read=0
io_write=0
arch=0
engine_version=0
battery=1
gamemode=0
vkbasalt=0
frame_count=0
show_fps_limit=0
resolution=0
gpu_load_change=0
core_load_change=0
cpu_load_change=0
fps_color_change=0
hdr=1
refresh_rate=1
media_player=0
debug=1
version=0
frame_timing_detailed=1
network=1
present_mode=0
proc_vram=0
procmem=0
display_server=0
gpu_efficiency=0
cpu_efficiency=0
gpu_fan=0
gpu_junction_temp=0
gpu_voltage=0
gpu_mem_temp=0
gpu_mem_clock=0
gpu_power=0
gpu_power_limit=0
cpu_power=0
vram=0
ram_temp=0
fan=0
