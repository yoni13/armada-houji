# ksmd scans only memory marked mergeable (the Game Mode session, see
# gamescope-session-plus@steam.service.d/houji-ksm.conf).
w- /sys/kernel/mm/ksm/use_zero_pages - - - - 1
# Default 20 ms kept ksmd near 9% of one core with only Steam's UI open.
w- /sys/kernel/mm/ksm/sleep_millisecs - - - - 100
w- /sys/kernel/mm/ksm/run - - - - 1
