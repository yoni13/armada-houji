# Linux cannot set the PMIC RTC, which reads about 1970, and the kernel copies it
# into the system clock when rtc0 registers. Start after that, and with -s step
# the clock forward to the drift file's time (chronyd's last hourly update)
# instead of running services in 1970 until NTP answers.
[Unit]
Wants=dev-rtc0.device
After=dev-rtc0.device

[Service]
ExecStart=
ExecStart=/usr/sbin/chronyd -n -s $OPTIONS
